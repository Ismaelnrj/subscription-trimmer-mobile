name: Checks

on:
  push:
  pull_request:
  # WEEKLY RUN, with the owner's explicit yes on 2026-10-12 (CLAUDE.md, NEVER
  # CREATE A SCHEDULED ANYTHING). Every check also runs once a week with no
  # push, so a guide going stale or a time dependent rule breaking is caught
  # even in a quiet week. Monday 04:00 UTC: 06:00 Vienna in summer, 05:00 in
  # winter. A green run sends nothing; a red one is a GitHub email. No phone
  # push from this repo's side. GitHub pauses schedules in a public repo after
  # 60 days without activity; re-enable it in the Actions tab if that happens.
  schedule:
    - cron: "0 4 * * 1"
  # The same run by hand: Actions tab > Checks > Run workflow.
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # pnpm is the authoritative package manager for this repo
      # (packageManager: pnpm@9.15.0). This job used to run `npm install
      # --legacy-peer-deps`, which ignores pnpm-lock.yaml completely and
      # re-resolves every range from scratch, so CI was testing a dependency
      # tree nobody had on their machine and could go green or red for reasons
      # unrelated to the commit.
      #
      # No version pinned here on purpose: action-setup v4 reads
      # packageManager out of package.json, so the version cannot drift away
      # from the one the repo declares.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile makes a lockfile that no longer matches package.json
      # a CI failure instead of something CI silently works around. If this
      # step fails, the fix is `pnpm install` locally and committing the
      # updated pnpm-lock.yaml, never removing the flag.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tools/typecheck.py rather than `npx tsc --noEmit`. npx falls through to
      # whatever tsc is on PATH when the local one is missing, and a TS version
      # that rejects this tsconfig exits before checking a single file, which
      # reads as a clean run. The script insists on the pinned compiler in
      # node_modules and treats a TS5xxx config error as a failure, not an
      # empty pass.
      - name: Type check
        run: python3 tools/typecheck.py

      # Both of these exist to catch a defect that breaks no build and fails no
      # test: a legal document drifting between its app copy and its served
      # copy, and the language store re-enabling notifications somebody turned
      # off. CLAUDE.md lists them as pre-ship checks, so CI is where they
      # belong rather than in a habit.
      - name: Legal document sync
        run: python3 tools/check-legal-sync.py

      - name: Language store reminder guard
        run: python3 tools/check-language-store.py

      # The script that decides OTA or native build. A wrong OTA crashes every
      # install and a false alarm burns a versionCode, so its rules are pinned.
      - name: Native build verdict rules
        run: python3 .claude/skills/trimio-release/scripts/test_needs_native_build.py

      # TEST BEFORE LINT, deliberately. With lint first, its failure marked the
      # Test step "skipped" and the suite never ran at all, for months, while
      # the run simply showed a red X that read as a style complaint. A broken
      # test must never be hidden behind a formatting opinion again.
      - name: Test
        run: pnpm test

      # The site pages are generated, so a source edited without regenerating
      # leaves the live page saying something the source no longer says (and
      # the cancel guides would then disagree with the app, which reads the
      # same data). Rebuild both and fail if anything under backend/ moved.
      - name: Generated site pages match their sources
        run: |
          python3 tools/build-landing.py > /dev/null
          node --experimental-strip-types tools/build-guides.mjs 2>/dev/null
          git diff --exit-code -- backend/

      # Measures the landing pages in a real Chromium with the real font: the
      # signup button inside the first screen at phone and laptop sizes, the
      # hero lead at 20 words or fewer, and no sideways scroll at 320 and 360.
      # It found the German button below the fold on its first run, which no
      # test and no crash report could see. Playwright is installed with pnpm in
      # /tmp, outside the repo and pinned, so the repo's package.json and
      # lockfile are untouched.
      - name: Landing page layout
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && echo '{"private":true}' > package.json
          pnpm add playwright@1.56.1 --silent
          ./node_modules/.bin/playwright install --with-deps chromium > /dev/null
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/pw/node_modules node .claude/skills/trimio-design/scripts/check_landing.js --ci

      - name: Lint
        run: pnpm lint
